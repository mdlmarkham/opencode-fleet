name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # OpenClaw refuses Node < 22.22.3 (SQLite WAL bug); see package.json "engines".
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `npm run build` runs `tsc`, so this is also the typecheck.
      - run: npm run build
      - run: npm test

  # Checks the manifest against the registered tools. Reported but not yet
  # required: it has not been run in CI before, so a failure here is a prompt to
  # look, not a blocker, until it has proven stable (then drop continue-on-error).
  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run plugin:validate
