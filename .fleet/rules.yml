schemaVersion: 1
# Paths every tool-adder edits (SKILL.md tools table, the SCHEMA_BUDGET_CHARS ratchet, contracts.tools):
# two live specs touching any of them must be ordered, never interleaved (issue #260 item 3).
serialize:
  - skills/opencode-fleet/SKILL.md
  - src/issue171.test.ts
  - openclaw.plugin.json
rules:
  - id: protocol-older-node-test
    severity: block-candidate
    match:
      paths: [src/protocol.ts, src/gateway-policy.ts, src/node/handler.ts]
    message: A wire-protocol change must be proven against an older node.
    evidence: "Decision 0003; the #76 revert (stamping protocol on every request broke older nodes and poisoned the probe)."
    requires:
      - Add a test that simulates a node below the new protocol and shows it refuses instead of silently dropping the feature.
      - Bump PROTOCOL_VERSION and add a FEATURE_MIN_PROTOCOL entry for any new request field.
  - id: redaction-false-positive-test
    severity: advise
    match:
      paths: [src/untrusted.ts, src/redact.ts, src/decision-backends.ts]
    message: A redaction change needs a false-positive test next to the seeded-secret test.
    evidence: "The rejected global redactor in PR #109 redacted shas, run ids and camelCase."
    requires:
      - Show that ordinary text (shas, run ids, identifiers) is not redacted.
  - id: security-independent-review
    severity: block-candidate
    match:
      paths: [src/guard.ts, src/deny-baseline.ts, src/decision-backends.ts, src/provision.ts, src/ssh.ts]
    message: Security-boundary changes get an independent review, from a different session than the author.
    evidence: "Decision 0002 and the review policy open in #45."
  - id: serialize-manager-gates
    severity: advise
    match:
      keywords: [verify.sh, vitest, gate, reviewer, review-spawn, subagent]
    message: Run at most one verification gate on the manager host at a time, and spawn reviewers as isolated remote runs rather than local child sessions.
    evidence: "2026-10-05: two concurrent gates drove host load to 39, vitest RPC timed out, and 8 FALSE failures appeared; all were green when re-run quiet. 2026-10-06: three local reviewers were killed by gateway restarts ('agent.wait unavailable') — the local-subagent review pattern is wrong."
    requires:
      - "Do not overlap a reviewer gate with the manager's own gate; let the manager's gate finish first (the #263 incident)."
      - Spawn review runs as isolated remote fleet runs (fleet_review prepare/collect on a node distinct from the author's), never as local child sessions that die with a gateway restart.
  - id: loop-survives-restart
    severity: advise
    match:
      paths: [src/mission-runner.ts, src/mission-node.ts, src/mission-supervisor.ts, src/ledger.ts, src/recovery.ts]
    message: Long-running loop state must survive a node or gateway restart; a false negative (verified work reported unverified) is a defect, not a nuisance.
    evidence: "#256 (first dispatch after a node restart false-fails), #257 (ledger loses the run→checkout link across a restart, so fleet_sync calls verified runs unverified)."
    requires:
      - Persist or reconcile the run→checkout link across restarts rather than letting it go null.
      - Add a test that simulates the restart and shows the loop resumes rather than false-failing.
